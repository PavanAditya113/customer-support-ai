name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── STAGE 1: Test ─────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 backend/ frontend/ --max-line-length=120 --ignore=E501,W503 || true

      - name: Verify imports
        run: |
          cd backend
          python -c "import fastapi, sqlalchemy, pandas, numpy, sklearn, langdetect"
          echo "All imports OK"

  # ── STAGE 2: Build Docker Images ──────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f Dockerfile.backend -t support-backend .

      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t support-frontend .

      - name: Verify images
        run: docker images | grep support

  # ── STAGE 3: Deploy to Render (main branch only) ──────────────
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy backend to Render
        run: |
          if [ -n "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}" ]; then
            curl -f -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}" \
              -H "Content-Type: application/json" && echo "Backend deploy triggered"
          else
            echo "RENDER_BACKEND_DEPLOY_HOOK not set — skipping"
          fi

      - name: Deploy frontend to Render
        run: |
          if [ -n "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}" ]; then
            curl -f -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}" \
              -H "Content-Type: application/json" && echo "Frontend deploy triggered"
          else
            echo "RENDER_FRONTEND_DEPLOY_HOOK not set — skipping"
          fi

      - name: Deployment triggered
        run: echo "Deployed to Render — check https://dashboard.render.com"
